[app]
name = "fittrackee"
version = "0.1.0"
description = "FitTrackee — self-hosted outdoor activity & workout tracker, with bundled PostgreSQL/PostGIS and one-click owner SSO"
authors = ["Andrew Laack <andrew@laack.co>"]

[runtime.container]
image = "Dockerfile"
port = 8080

[routing]
health_check = "/_healthz"
# Single-tenant per zone. FitTrackee has an opt-in public workout-sharing
# feature, but it is off by default; leave public_paths empty until/unless
# that is wired up, so anonymous traffic hits FitTrackee's normal login.
public_paths = []

[resources]
# PostgreSQL + PostGIS + gunicorn in one container needs headroom.
memory_mb = 1024
cpu_millicores = 1000

[data]
app_data = true
